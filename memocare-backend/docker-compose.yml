services:
  postgres:
    image: postgres:15
    container_name: memocare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: memocare
      POSTGRES_PASSWORD: memocare
      POSTGRES_DB: memocare_dev
    ports:
      - "5432:5432"
    volumes:
      - memocare_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: memocare-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  memocare_pg_data:
